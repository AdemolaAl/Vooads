<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vooads Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F6F2">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/admin-mail.css">
<script src="/assets/js/eyes.js" defer></script>
<script src="/assets/js/voo-tool-icons.js?v=1"></script>
<script src="/assets/js/admin-business.js?v=1"></script>
<script src="/assets/js/admin-showcase.js?v=1"></script>
<script src="/assets/js/admin-profit.js?v=1"></script>
<script src="/assets/js/admin-actors.js?v=1"></script>
<style>
:root{--side:264px;--ease:cubic-bezier(.2,.9,.2,1);--card-sh:0 1px 0 rgba(18,17,16,.03),0 18px 40px -32px rgba(18,17,16,.35)}
html,body{background:var(--app)}
body{font-size:15px}
.it.b{color:var(--brand-d)}
.toast svg{width:18px;height:18px;flex:none}
.fld{align-content:start}

/* ---------- Boot / auth screens ---------- */
.boot{min-height:100vh;display:grid;place-items:center}
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
.auth-art{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art::before{content:"";position:absolute;width:620px;height:620px;right:-220px;bottom:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,74,28,.55),rgba(255,74,28,0));filter:blur(10px);animation:drift 14s ease-in-out infinite alternate}
.auth-art::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
@keyframes drift{to{transform:translate(-120px,-80px) scale(1.15)}}
.auth-art>*{position:relative;z-index:1}
.auth-art .lword{color:#fff}
.auth-art h1{font-size:clamp(38px,4.6vw,62px);letter-spacing:-.055em;margin-top:28px;max-width:12ch}
.auth-art h1 .it{color:var(--brand-glow)}
.auth-art p{color:#BDB7AA;max-width:40ch;margin-top:16px;font-size:16.5px}
.auth-art .face{--s:112px;margin-top:40px;background:#1E1C19;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 60px -20px rgba(0,0,0,.7)}
.auth-art .ticks{display:flex;gap:18px;flex-wrap:wrap;color:#8F897C;font-size:13px;font-weight:600}
.auth-art .ticks span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:middle}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:400px;animation:up .5s var(--ease) both}
.auth-card h2{font-size:32px}
.auth-card .sub{color:var(--mut);margin:10px 0 26px}
.auth-card form{display:grid;gap:16px}
.code-inp{font-size:28px!important;letter-spacing:.5em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;padding:14px!important}
.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--mut);line-height:1.5}
.note b{color:var(--ink)}
.note.brand{background:var(--brand-soft);border-color:var(--brand-soft2);color:var(--brand-dd)}
.note.warn{background:var(--warn-bg);border-color:#F4DFAE;color:#7A4E00}
.note.bad{background:var(--bad-bg);border-color:#F6C9C3;color:#9E2A20}
.linkbtn{background:none;border:0;padding:0;color:var(--mut);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.linkbtn:hover{color:var(--ink)}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{padding:28px 22px 30px;min-height:auto}.auth-art h1{font-size:36px;margin-top:22px}.auth-art .face{display:none}.auth-art .ticks{margin-top:22px}}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 14px 14px;z-index:60}
.side::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 260px at 0% 0%,rgba(255,74,28,.12),transparent 70%)}
.side>*{position:relative;z-index:1}
.side .brandrow{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.side .lmark{background:#24211D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.side .lword{color:#fff;font-size:21px}
.side .tag{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-glow);background:rgba(255,74,28,.13);border-radius:999px;padding:4px 8px;margin-left:auto}
.nav{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav h6{margin:16px 10px 6px;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#6E685C}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;color:#B9B2A4;text-decoration:none;font-weight:600;font-size:14.5px;transition:background .2s,color .2s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(255,255,255,.08);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--brand);animation:pop .3s var(--ease)}
.nav a.on svg{color:var(--brand-glow);opacity:1}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:14px;background:rgba(255,255,255,.045);margin-top:10px}
.avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,#FF7A4D,#E8390C);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.me .who{min-width:0;flex:1}
.me .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:12px;color:#8F897C}
.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:11px;border:0;background:transparent;color:inherit;cursor:pointer;transition:background .2s,transform .2s;flex:none}
.iconbtn:hover{background:rgba(127,127,127,.14)}
.iconbtn svg{width:18px;height:18px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.scrim{display:none}
.page{padding:34px clamp(16px,3.4vw,44px) 90px;max-width:1240px;width:100%;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;animation:up .45s var(--ease) both}
.phead h1{font-size:clamp(28px,3.2vw,38px);letter-spacing:-.05em}
.phead p{color:var(--mut);margin-top:8px;max-width:70ch;font-size:15px}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .38s var(--ease);box-shadow:30px 0 80px -30px rgba(0,0,0,.6)}
  .side:not(.open){box-shadow:none;visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(18,17,16,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(247,246,242,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .t{font-weight:800;letter-spacing:-.03em;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page{padding-top:22px}
}

/* ---------- Building blocks ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--card-sh);min-width:0}
.card.pad{padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:17px;letter-spacing:-.03em}
.card-h p{color:var(--mut);font-size:13.5px;margin-top:3px}
.card-b{padding:20px 22px}
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields .full{grid-column:1/-1}
@media (max-width:720px){.grid2,.grid3,.fields{grid-template-columns:1fr}}
.inp.sm{padding:9px 12px;border-radius:11px;font-size:14.5px}
@media (max-width:720px){.inp.sm{font-size:16px}}
.inp.mono{font-family:var(--mono);font-size:13.5px}
.stagger>*{animation:up .45s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.hint{font-size:12.5px;color:var(--mut2)}
.k{font-family:var(--mono);font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:2px 6px;color:var(--mut);word-break:break-all}
.empty{padding:46px 20px;text-align:center;color:var(--mut)}
.empty .face{--s:64px;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.sk{border-radius:12px;height:16px;background:linear-gradient(90deg,#EFECE4 0%,#F7F5EF 50%,#EFECE4 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.btn .spinner{width:15px;height:15px;border-width:2px}
.btn.danger{background:var(--bad);color:#fff}
.btn.dghost{background:#fff;color:var(--bad);border:1.5px solid #F2C7C1;font-weight:700}
.btn.dghost:hover{border-color:var(--bad)}
.btn.xs{padding:6px 11px;font-size:13px;gap:6px}
.btn.xs svg,.btn.sm svg{width:15px;height:15px}
.pill.sky{color:#0E6E9C;background:#E3F4FD}
.pill.violet{color:#4A3BD1;background:#ECE9FF}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.dot.live{box-shadow:0 0 0 0 currentColor}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(22,163,90,.5)}80%,100%{box-shadow:0 0 0 7px rgba(22,163,90,0)}}

/* switch */
.sw{--w:42px;position:relative;width:var(--w);height:24px;border-radius:999px;border:0;background:#D9D4C7;cursor:pointer;flex:none;transition:background .25s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.swl{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}

/* segmented */
.seg{display:inline-flex;background:#EFECE4;border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--mut);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* tables -> cards on phones */
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tbl th:first-child{border-top-left-radius:19px}.tbl th:last-child{border-top-right-radius:19px}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#FCFBF8}
.tbl .r{text-align:right}
.tbl .sub{display:block;color:var(--mut2);font-size:12.5px;margin-top:2px}
.tbl td.nowrap{white-space:nowrap}
@media (max-width:760px){
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
  .tbl.cards tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  .tbl.cards tr:last-child{border-bottom:0}
  .tbl.cards td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right}
  .tbl.cards td::before{content:attr(data-l);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);text-align:left;flex:none}
  .tbl.cards td[data-l=""]::before{display:none}
  .tbl.cards td.lead{display:block;text-align:left;font-size:15px;padding-bottom:6px}
  .tbl.cards td.lead::before{display:none}
  .tbl.cards .r{text-align:right}
}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--mut)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.05em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--mut2);margin-top:4px}
.kpi.hero{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.hero .l{color:#B9B2A4}.kpi.hero .s{color:#8F897C}
.kpi.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,74,28,.5),transparent)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpi .v{font-size:25px}.kpi{padding:15px 16px}}
.chart{width:100%;height:200px;display:block}
.chart .bar{fill:var(--brand);transition:opacity .2s;transform-origin:bottom;transform-box:fill-box;animation:grow .7s var(--ease) both}
.chart .bar:hover{opacity:.75}
@keyframes grow{from{transform:scaleY(0)}}
.chart .ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);font-weight:600;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.status-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.status-strip a{text-decoration:none}
.stat{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;transition:transform .25s var(--ease),box-shadow .25s}
.stat:hover{transform:translateY(-2px);box-shadow:0 24px 40px -30px rgba(18,17,16,.45)}
.stat .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:18px;height:18px}
.stat b{display:block;font-size:14.5px}
.stat span{font-size:13px;color:var(--mut)}
@media (max-width:860px){.status-strip{grid-template-columns:1fr}}

/* drawer + modal */
.drawer-wrap{position:fixed;inset:0;z-index:80;pointer-events:none}
.drawer-wrap .bg{position:absolute;inset:0;background:rgba(18,17,16,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(620px,100vw);background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s var(--ease);box-shadow:-40px 0 80px -40px rgba(0,0,0,.45)}
.drawer-wrap.on{pointer-events:auto}
.drawer-wrap.on .bg{opacity:1}
.drawer-wrap.on .drawer{transform:none}
.drawer-wrap:not(.on) .drawer{visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:22px;letter-spacing:-.04em;word-break:break-word}
.drawer .dh p{color:var(--mut);font-size:13.5px;margin-top:4px}
.drawer .db{flex:1;overflow-y:auto;padding:20px 22px 28px;overscroll-behavior:contain}
.drawer .df{padding:14px 22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fff}
.dsec{margin-top:22px}
.dsec>h4{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin-bottom:10px}
.modal-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(18,17,16,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:460px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);animation:pop .3s var(--ease) both;max-height:calc(100dvh - 32px);overflow-y:auto}
.modal h3{font-size:21px;letter-spacing:-.04em}
.modal .body{margin:12px 0 20px;display:grid;gap:14px;color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand)}

/* misc lists */
.bal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bal div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.bal div:first-child{background:var(--ink);color:#fff;border-color:var(--ink)}
.bal span{font-size:11.5px;font-weight:700;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em}
.bal b{display:block;font-size:22px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
@media (max-width:480px){.bal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .m{min-width:0}
.li .m small{display:block;color:var(--mut2);font-size:12.5px}
.pos{color:var(--good);font-weight:800}.neg{color:var(--bad);font-weight:800}

/* providers */
.kind{overflow:hidden}
.kind .card-h{background:linear-gradient(180deg,#FDFCFA,#fff)}
.kind-ic{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.kind-ic svg{width:18px;height:18px}
.prov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);transition:background .2s}
.prov:last-child{border-bottom:0}
.prov.off{opacity:.62}
.prov.def{background:linear-gradient(90deg,var(--brand-soft),#fff 60%)}
.prov h5{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:0}
.prov .meta{font-size:13px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.prov .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prov .test-note{grid-column:2/-1;font-size:13px;margin-top:-4px}
.defbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--mut);transition:all .2s}
.defbtn i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center}
.defbtn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.defbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;cursor:default}
.defbtn.on i::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.prio{width:78px;text-align:center}
.prov .pnote{grid-column:2/-1}
@media (max-width:760px){
  .prov{grid-template-columns:1fr;gap:10px;padding:16px}
  .prov .ctl{justify-content:flex-start}
  .prov .test-note,.prov .pnote{grid-column:1}
}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--mut);font-weight:600}
.flow .chip{background:#fff;border:1px solid var(--line2);border-radius:999px;padding:5px 11px;color:var(--ink);font-weight:700}
.flow .chip.b{background:var(--brand);border-color:var(--brand);color:#fff}

/* methods */
.mcard{padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.mcard .btn{white-space:normal;text-align:center}
.mcard .top{display:flex;gap:14px;align-items:flex-start}
.mlogo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;letter-spacing:-.03em}
.copybox{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.copybox code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* pricing */
.plan{padding:18px;display:grid;gap:12px;position:relative}
.plan .del{position:absolute;top:12px;right:12px}
.savebar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:rise .35s var(--ease) both;max-width:calc(100vw - 24px)}
.savebar span{font-weight:700;font-size:14px}
.savebar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.savebar .btn.brand,.savebar .btn.white{background:#fff;color:var(--ink)}
.savebar .btn.brand .arr,.savebar .btn.white .arr{background:var(--ink);color:#fff}
@media (min-width:961px){.savebar{left:calc(50% + var(--side)/2)}}
@media (max-width:520px){.savebar{border-radius:18px;flex-wrap:wrap;justify-content:center;padding:10px;bottom:10px}.savebar span{width:100%;text-align:center}}
.margin{font-weight:800;font-variant-numeric:tabular-nums}
.margin.good{color:var(--good)}.margin.warn{color:var(--warn)}.margin.bad{color:var(--bad)}
.tbl .inp.sm{min-width:70px;max-width:150px}
.tbl .sub.k{display:table!important;margin-top:4px}

/* blog */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.editor textarea{border:0;border-radius:0;min-height:520px;font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:18px;resize:vertical}
.editor textarea:focus{box-shadow:none}
.editor .pv{border-left:1px solid var(--line);padding:18px 22px;max-height:640px;overflow-y:auto;background:#FDFCFA}
.etabs{display:none}
@media (max-width:860px){.editor{grid-template-columns:1fr}.editor .pv{border-left:0}.etabs{display:inline-flex;margin-bottom:10px}.editor.w .pv,.editor.p textarea{display:none}}
.prose{font-size:15.5px;line-height:1.7;color:#2B2823}
.prose h1,.prose h2,.prose h3{margin:1.2em 0 .4em;letter-spacing:-.035em;line-height:1.15}
.prose h1{font-size:28px}.prose h2{font-size:22px}.prose h3{font-size:18px}
.prose p,.prose ul,.prose ol,.prose blockquote,.prose pre{margin:0 0 1em}
.prose img{border-radius:12px}
.prose blockquote{border-left:3px solid var(--brand);padding-left:14px;color:var(--mut)}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:2px 5px;border-radius:5px}
.prose pre{background:var(--ink);color:#eee;padding:14px;border-radius:12px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose a{color:var(--brand-d)}
.prose table{border-collapse:collapse;width:100%;font-size:14px}
.prose td,.prose th{border:1px solid var(--line);padding:6px 8px}
.cover{display:flex;gap:14px;align-items:center}
.cover .img{width:120px;aspect-ratio:16/10;border-radius:12px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);flex:none}
.thumb{width:52px;height:36px;border-radius:8px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);flex:none}

/* emails */
.mailgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.mailframe{width:100%;height:640px;border:0;border-radius:14px;background:#F4F2EC}
@media (max-width:1100px){.mailgrid{grid-template-columns:1fr}.mailframe{height:520px}}

/* support */
.inbox{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - 210px);min-height:480px;overflow:hidden}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.th{display:block;width:100%;text-align:left;border:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.th:hover{background:#FCFBF8}
.th.on{background:var(--brand-soft)}
.th .r1{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.th .r1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .r1 time{font-weight:600;color:var(--mut2);font-size:12px;flex:none}
.th p{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.th .unread{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:6px}
.conv{display:flex;flex-direction:column;min-width:0}
.conv .ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#FDFCFA}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;animation:up .3s var(--ease) both}
.msg small{display:block;font-size:11.5px;opacity:.6;margin-top:4px}
.msg.u{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.s{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.reply{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.reply textarea{min-height:46px;max-height:160px;resize:none}
@media (max-width:860px){.inbox{grid-template-columns:1fr;height:calc(100dvh - 190px)}.inbox.has .threads{display:none}.inbox:not(.has) .conv{display:none}}
.back-only{display:none}
@media (max-width:860px){.back-only{display:inline-grid}}

/* roles */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.role{padding:18px;display:grid;gap:10px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;text-align:left;font:inherit;color:inherit}
.role:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 24px 40px -30px rgba(18,17,16,.45)}
.role h4{font-size:16px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role p{font-size:13.5px;color:var(--mut)}
.permbar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.permbar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .6s var(--ease)}
.pgroup{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.pgroup h5{font-size:13px;font-weight:800;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand);margin:1px 0 0;flex:none}
.chk small{display:block;color:var(--mut2);font-family:var(--mono);font-size:11px}
.invite-link{animation:pop .35s var(--ease) both}
.preview-list{display:flex;flex-wrap:wrap;gap:8px}

/* =====================================================================
   v2 design layer (SPEC §1): warm off-white, two-tone headlines, black pills, mono labels
   ===================================================================== */
:root{
  --app:#F7F6F2;--ink:#0B0B0A;--line:#E6E3DA;--line2:#DCD8CC;--soft:#FAF9F5;--mut:#66625A;--mut2:#A19E95;--hint:#8A867C;
  --good:#1F9D55;--good-bg:#E6F5EC;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --side:248px;--card-sh:0 1px 2px rgba(11,11,10,.03),0 14px 34px -28px rgba(11,11,10,.3);
}
body{font-family:var(--sans);font-weight:500;color:var(--ink)}
h1,h2,h3,h4{font-weight:800}
.it.b{color:var(--mut2)}
.hint{color:var(--hint)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mono{font-family:var(--mono)}
.lword .g{color:var(--mut2)}

/* buttons: black pill, white circle arrow on main actions */
.btn{border-radius:999px;font-weight:700}
.btn.brand,.btn.solid{background:var(--ink);color:#fff}
.btn.brand:hover,.btn.solid:hover{background:#2A2926}
.btn.accent{background:var(--brand);color:#fff}
.btn.accent:hover{background:var(--brand-d)}
.btn.ghost{border:1px solid var(--line2);background:#fff}
.btn .arr{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);display:inline-grid;place-items:center;flex:none;margin:-4px -8px -4px 2px;transition:transform .25s var(--ease)}
.btn .arr svg{width:14px!important;height:14px!important}
.btn.sm .arr{width:24px;height:24px;margin:-5px -9px -5px 0}
.btn.xs .arr{width:20px;height:20px;margin:-3px -7px -3px 0}
.btn.lg .arr{width:32px;height:32px}
.btn:hover .arr{transform:translateX(2px)}
.btn.ghost .arr{background:var(--ink);color:#fff}

/* shell: light sidebar on the warm ground */
.side{background:var(--app);color:var(--ink);border-right:1px solid var(--line);padding:18px 12px 12px}
.side::after{display:none}
.side .lmark{background:var(--ink);box-shadow:none}
.side .lword{color:var(--ink);font-size:21px}
.side .tag{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.08em;color:var(--mut);background:#fff;border:1px solid var(--line)}
.nav h6{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;color:var(--mut2);margin:18px 10px 6px}
.nav a{color:#4A473F;font-size:14px;padding:8px 10px;border-radius:11px}
.nav a svg{width:17px;height:17px;opacity:.8}
.nav a:hover{background:rgba(11,11,10,.045);color:var(--ink)}
.nav a.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 6px 16px -12px rgba(11,11,10,.35)}
.nav a.on::before{display:none}
.nav a.on svg{color:var(--ink);opacity:1}
.nav .badge{font-family:var(--mono);font-weight:600;font-size:10.5px}
.nav .badge.soft{background:var(--ink)}
.me{background:#fff;border:1px solid var(--line)}
.me .who span{color:var(--mut2);font-family:var(--mono);font-size:11px}
.avatar{background:var(--ink);color:#fff;border-radius:50%}
.topbar{background:rgba(247,246,242,.88)}
.phead{align-items:flex-end}
.phead .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.phead h1{font-weight:800;letter-spacing:-.05em;line-height:1.02}
.phead p{color:var(--mut)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(255,74,28,.45)}80%,100%{box-shadow:0 0 0 7px rgba(255,74,28,0)}}
.page{animation:fadein .35s var(--ease) both}
@keyframes fadein{from{opacity:.4}}
.page.wide{max-width:none}
.card{border-color:var(--line);box-shadow:var(--card-sh)}
.tbl th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.07em;color:var(--mut2)}
.kpi .l{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kpi.hero .l{color:#A9A398}
.kpi .v{font-weight:800}
.k{font-family:var(--mono)}
.note .k,.envrow .k{word-break:normal;white-space:nowrap}
.seg button{font-weight:700}
.tabs button.on{border-color:var(--ink)}
.sw[aria-checked="true"]{background:var(--ink)}
.chk input{accent-color:var(--ink)}
@media (max-width:960px){.side{background:var(--app)}}

/* calm "not available yet" state */
.na{display:flex;gap:16px;align-items:flex-start;padding:22px}
.na .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mut);background:var(--soft)}
.na .ic svg{width:18px;height:18px}
.na b{display:block;font-size:15.5px;letter-spacing:-.02em}
.na p{color:var(--mut);font-size:14px;margin-top:3px;max-width:62ch}

/* overview: KPI sparkbars */
.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:12px}
.spark i{flex:1;min-width:2px;border-radius:3px 3px 1px 1px;background:var(--ink);opacity:.14;transform-origin:bottom;animation:grow .8s var(--ease) both;height:var(--h)}
.spark i:last-child{opacity:1;background:var(--brand)}
.kpi.hero .spark i{background:#fff;opacity:.22}.kpi.hero .spark i:last-child{background:var(--brand);opacity:1}
.spark.cat i{opacity:1}
.kpi a.more{position:absolute;right:16px;top:16px;color:var(--mut2)}
.kpi a.more svg{width:16px;height:16px}

/* ===================== Support inbox ===================== */
.page.wide{padding-inline:clamp(16px,2vw,28px)}
.ibx{display:grid;grid-template-columns:184px 320px minmax(0,1fr);height:calc(100dvh - 196px);min-height:540px;overflow:hidden;padding:0;position:relative}
.ibx.ro{height:calc(100dvh - 262px)}
.ibx-views{border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.ibx-views h6{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin:4px 8px 6px}
.vbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14px;color:#4A473F;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.vbtn svg{width:16px;height:16px;flex:none;opacity:.8}
.vbtn .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mut2)}
.vbtn:hover{background:rgba(11,11,10,.045)}
.vbtn.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.vbtn.hot .n{color:#fff;background:var(--bad);border-radius:999px;padding:1px 7px}
.ibx-keys{margin-top:auto;padding:12px 8px 2px;font-size:12px;color:var(--hint);display:grid;gap:5px}
.ibx-keys span{display:flex;justify-content:space-between;gap:8px}
kbd{font-family:var(--mono);font-size:10.5px;background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink)}
.ibx-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.ibx-lh{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ibx-lh .srch{position:relative}
.ibx-lh .srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut2)}
.ibx-lh .srch input{padding-left:36px}
.vchips{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.vchips::-webkit-scrollbar{display:none}
.vchip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--mut)}
.vchip b{font-family:var(--mono);font-weight:500;font-size:11px;margin-left:4px;color:var(--mut2)}
.vchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vchip.on b{color:#C9C4B8}
.tlist{flex:1;overflow-y:auto;overscroll-behavior:contain}
.tk{display:grid;gap:5px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 14px 12px 16px;cursor:pointer;position:relative;transition:background .15s;font:inherit;color:inherit}
.tk:hover{background:#FCFBF8}
.tk.on{background:#F4F2EC}
.tk.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.tk .r1{display:flex;gap:8px;align-items:center;min-width:0}
.tk .who{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--mut)}
.tk.wait .who{color:var(--ink)}
.tk.wait .who::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-right:7px;vertical-align:1px}
.tk time{font-family:var(--mono);font-size:11px;color:var(--mut2);flex:none}
.tk .subj{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.tk .snip{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px}
.tk-enter{animation:up .35s var(--ease) both}
.pr,.sla,.tag2{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;line-height:1.5}
.pr.urgent{background:var(--bad);color:#fff}.pr.high{background:var(--bad-bg);color:var(--bad)}.pr.normal{background:var(--soft);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}.pr.low{color:var(--mut2);box-shadow:inset 0 0 0 1px var(--line)}
.sla.late{background:var(--bad-bg);color:var(--bad)}.sla.soon{background:var(--warn-bg);color:var(--warn)}.sla.ok{color:var(--mut2);box-shadow:inset 0 0 0 1px var(--line)}
.tag2{color:var(--mut);background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);text-transform:none;letter-spacing:0}
.tag2 svg{width:11px;height:11px}
.st-dot{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.st-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mut2))}
.st-open{--c:var(--brand)}.st-pending{--c:var(--warn)}.st-solved{--c:var(--good)}.st-closed{--c:var(--mut2)}
.mini-av{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:8.5px;font-weight:800;display:inline-grid;place-items:center;flex:none;letter-spacing:0}
.mini-av.ext{background:var(--violet)}
.ibx-conv{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;min-height:0;position:relative;container-type:inline-size;container-name:conv}
.ibx-empty{grid-column:1/-1;display:grid;place-items:center;text-align:center;color:var(--mut);padding:30px}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.th-h{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px;background:#fff}
.th-h .t1{display:flex;align-items:flex-start;gap:10px;min-width:0}
.th-h h2{font-size:18px;letter-spacing:-.035em;line-height:1.2;word-break:break-word}
.th-h .sub{font-family:var(--mono);font-size:11px;color:var(--mut2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.th-ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl{position:relative;display:inline-flex;align-items:center}
.ctl select{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 26px 6px 11px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);max-width:180px}
.ctl::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ctl select:disabled{opacity:.6;cursor:not-allowed}
.ctl .lbl{font-family:var(--mono);font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.ibx .msgs{padding:18px 18px 22px;gap:12px}
.ibx .msg{max-width:min(78%,640px);font-size:14.5px;line-height:1.55}
.msg .by{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;opacity:.65;margin-bottom:4px;letter-spacing:.02em}
.msg.s .by{opacity:.7}
.msg.v{background:#2A2560;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.note{background:#FFF7DD;border:1px dashed #E2C15C;color:#4D3B00;align-self:flex-end;border-radius:14px}
.msg.note .by{color:#8A6A00;opacity:1}
.msg.bot{background:var(--soft);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:none;color:var(--mut2);font-family:var(--mono);font-size:11px;padding:0;max-width:100%;text-align:center}
.msg a{color:inherit}
.msg .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.daysep{align-self:center;font-family:var(--mono);font-size:10.5px;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:#fff;display:grid;gap:8px}
.composer .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.composer textarea{min-height:58px;max-height:220px;resize:none;border-radius:14px;font-size:14.5px;padding:11px 14px}
.composer.note-mode textarea{background:#FFFBEB;border-color:#EAD48A}
.composer.note-mode .seg button.on[data-m="note"]{background:#FFF1C2}
.composer .send-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.composer .send-row>*:not(#cmhint){flex:none}
.composer .send-row .grow{min-width:80px}
.ro-banner{display:flex;gap:12px;align-items:center;padding:12px 16px;background:#2A2560;color:#fff;font-size:14px}
.ro-banner svg{width:18px;height:18px;flex:none}
.ro-banner b{font-weight:800}
.macro-pop{position:absolute;bottom:calc(100% + 8px);right:0;width:min(380px,calc(100vw - 40px));max-height:340px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 60px -24px rgba(11,11,10,.4);display:flex;flex-direction:column;z-index:20;animation:pop .2s var(--ease) both;overflow:hidden}
.macro-pop input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px}
.macro-pop input:focus{box-shadow:none}
.macro-pop .ml{overflow-y:auto}
.macro-pop button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.macro-pop button:hover,.macro-pop button.on{background:var(--soft)}
.macro-pop button b{display:block;font-size:13.5px}
.macro-pop button span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx{border-left:1px solid var(--line);overflow-y:auto;padding:16px;background:var(--soft);display:grid;gap:12px;align-content:start;min-height:0;overscroll-behavior:contain}
.ctx .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.ctx h5{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.ctx .who{display:flex;gap:10px;align-items:center;min-width:0}
.ctx .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .who span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .bigcr{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em}
.ctx .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ctx .kv:last-child{border-bottom:0}
.ctx .kv span:first-child{color:var(--mut)}
.ctx .kv span:last-child{text-align:right;min-width:0;word-break:break-word}
.ctx .mini{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.ctx .mini:last-child{border-bottom:0}
.ctx .mini small{display:block;color:var(--mut2);font-family:var(--mono);font-size:10.5px}
.ctx .quick{display:flex;gap:6px;flex-wrap:wrap}
.ctx-x{display:none}
.ctx-toggle{display:none}
.ctx{position:absolute;top:0;right:0;bottom:0;width:min(320px,92%);z-index:15;transform:translateX(102%);transition:transform .35s var(--ease),visibility 0s .35s;visibility:hidden;box-shadow:-30px 0 60px -30px rgba(11,11,10,.35)}
.ctx.open{transform:none;visibility:visible;transition:transform .35s var(--ease)}
.ctx-x{display:inline-grid}
.ctx-toggle{display:inline-flex}
.cv-in{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;height:100%;position:relative}
@container conv (min-width:860px){
  .cv-in{grid-template-columns:minmax(0,1fr) 290px}
  .ctx{position:static;transform:none;visibility:visible;width:auto;box-shadow:none;transition:none}
  .ctx-x,.ctx-toggle{display:none}
}
@media (max-width:1240px){
  .ibx{grid-template-columns:320px minmax(0,1fr)}
  .ibx-views{display:none}
  .vchips{display:flex}
}
@media (max-width:760px){
  .ibx{grid-template-columns:1fr;height:calc(100dvh - 150px);min-height:460px;border-radius:16px}
  .ibx.has .ibx-list{display:none}
  .ibx:not(.has) .ibx-conv{display:none}
  .ibx .msg{max-width:88%}
  .th-h{padding:10px 12px}
  .composer .hide-xs,#cmhint{display:none}
  .composer .send-row{justify-content:flex-end}
  .page.wide .phead p{display:none}
  .page.thread-open{padding-top:10px}
  .page.thread-open .phead{display:none}
  .page.thread-open .ibx{height:calc(100dvh - 86px)}
  .ibx.ro{height:calc(100dvh - 230px)}
  .page.wide .phead{margin-bottom:14px}
}

/* radio cards (support mode) */
.rcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rcard{border:1.5px solid var(--line2);border-radius:16px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;display:grid;gap:6px;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.rcard:hover{transform:translateY(-2px)}
.rcard b{font-size:14.5px;display:flex;align-items:center;gap:8px}
.rcard b i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.rcard span{font-size:13px;color:var(--mut);line-height:1.45}
.rcard.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(11,11,10,.06)}

.rcard:disabled{cursor:not-allowed;opacity:.7;transform:none}
@media (max-width:860px){.rcards{grid-template-columns:1fr}}
.endpoint{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.endpoint:last-child{border-bottom:0}
.endpoint .m{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em}
.endpoint code{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.endpoint small{grid-column:2;color:var(--mut);font-size:12.5px;margin-top:-4px}
.envrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.envrow:last-child{border-bottom:0}
.envrow .grow b{font-family:var(--mono);font-size:13px}
.envrow .grow p{font-size:13px;color:var(--mut);margin-top:2px}
.sla-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.sla-grid .fld{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}

/* payment template chips */
.phs{display:flex;flex-wrap:wrap;gap:5px}
.phs button{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);background:#fff;border-radius:7px;padding:3px 7px;cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s}
.phs button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tplcheck{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;background:var(--ink);color:#E8E4DA;border-radius:12px;padding:12px;max-height:220px;overflow:auto}
.secth{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:8px}
.secth span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);white-space:nowrap}
.secth::after{content:"";flex:1;height:1px;background:var(--line)}

/* profit guard + video types */
.mp{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.mp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.mp.ok{color:var(--good);background:var(--good-bg)}.mp.low{color:var(--warn);background:var(--warn-bg)}.mp.loss{color:#fff;background:var(--bad)}
.mbar{height:6px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;min-width:80px;position:relative}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .6s var(--ease)}
.mbar .min{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);border-radius:2px}
.vt{padding:18px;display:grid;gap:12px;position:relative}
.vt.off{opacity:.7}
.vt .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-right:4px}
.vt .head h3{font-size:17px;letter-spacing:-.03em}
.vt .prev{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:13px}
.vt .prev .row{gap:8px}
.vt .prev .big{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.03em}
.lvadm{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.lvadm .lvr{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.lvadm .lvr.off{opacity:.62;background:var(--soft)}
.lvadm .lvr .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvadm .lvr .top b{font-size:14.5px;letter-spacing:-.02em}

.lvadm .lvm b{color:var(--ink)}
.planmax{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.planmax .fld label{font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.rng{width:100%;accent-color:var(--ink)}
.explain{font-size:14.5px;line-height:1.65;color:#3B3832;max-width:80ch}

/* ai brain */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{padding:16px;display:grid;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.vcard:hover{transform:translateY(-2px)}

.jsonbad{border-color:var(--bad)!important;box-shadow:0 0 0 4px var(--bad-bg)!important}
.jstate{font-family:var(--mono);font-size:12px}
.vdetail{display:grid;gap:12px}

.lesson{padding:18px;display:grid;gap:10px;align-content:start}
.lesson .num{font-family:var(--mono);font-size:11px;color:var(--mut2)}
.lesson h4{font-size:16.5px;letter-spacing:-.03em}
.lesson p{font-size:13.5px;color:var(--mut)}
.vbar{height:5px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .8s var(--ease)}
.genbox{display:grid;gap:10px}
.indet{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line)}

.timer{font-family:var(--mono);font-size:12.5px;color:var(--mut)}

.scene{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.scene .n{font-family:var(--mono);font-size:11px;color:var(--mut2)}
.scene audio{height:28px;max-width:160px}
#ptbl .tbl .inp.sm{max-width:none;min-width:0;width:100%}

.sla svg{width:11px;height:11px}

.btn.white .arr{background:var(--ink);color:#fff}

.auth-card .it.b{color:var(--mut2)}
@media (max-width:760px){.ctl .lbl{display:none}.th-ctl .sla{display:none}}
