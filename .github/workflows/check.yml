# Runs the full self-check (npm run check) on every pull request and every push to main and staging.
# Turn on branch protection for main (GitHub → Settings → Branches → Add rule → main → "Require status checks
# to pass" → pick "check") so only green code can be merged into the live site.
name: check

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg (the editing tools render real video in the checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Syntax check (every .js file and every inline <script>)
        run: npm run check:syntax

      - name: Self-check (boots the app on a throwaway database, runs every flow)
        run: npm run check
        env:
          NODE_ENV: development
